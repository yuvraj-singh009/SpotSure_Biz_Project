version: '3.8'

services:
  backend:
    build: .
    container_name: chat-backend
    # Changed from expose to ports to ensure the backend explicitly binds the port internally
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - chat-net

  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started # Forces Nginx to wait until the backend container running status is confirmed
    restart: unless-stopped
    networks:
      - chat-net

networks:
  chat-net:
    driver: bridge
